[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipro-tdx-sandbox"
version = "0.1.0"
description = "Mock TeamDynamix ticket lifecycle for the IPRO automation project"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = [".."]
include = ["sandbox*"]
